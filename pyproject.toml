[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scalps"
version = "0.1.0"
description = "Turn spatial single-cell data into explorable alpine landscapes."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Philipp Putze"}]
dependencies = ["anndata>=0.10", "numpy>=1.24", "scipy>=1.11", "pyvista>=0.49,<0.51", "matplotlib>=3.8", "imageio>=2.31", "pillow>=10"]

[project.optional-dependencies]
spatial = ["spatialdata>=0.4,<0.8"]
notebook = ["pyvista[jupyter]>=0.49,<0.51"]
dev = ["pytest>=8", "ruff>=0.9", "mkdocs-material>=9.5", "build>=1"]

[project.scripts]
scalps = "scalps.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/scalps"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
